schema_version: 1

handler:
  name: Wp100
  type: command_handler

units:
  - instance: Wp100K101SafetyDoor
    type: NexeedBasMoveStandard
    version: V2.1
    base_position:
      sensor: _100B101B
      output: _100K101B
      meaning: safety door open
    work_position:
      sensor: _100B101A
      output: _100K101A
      meaning: safety door closed
    manual_release: >-
      CommonManRelease AND
      Peripherals.BinIo._000K981_Y32
  - instance: Wp100K102PressingCylinder
    type: NexeedBasMoveStandard
    version: V2.1
    base_position:
      sensor: _100B102B
      output: _100K102B
      meaning: pressing cylinder raised
    work_position:
      sensor: _100B102A
      output: _100K102A
      meaning: pressing cylinder lowered
    manual_release: >-
      CommonManRelease AND
      Wp100K101SafetyDoor.Unit.OutImm.IsInWrkPos AND
      Peripherals.BinIo._000K913_Y32 AND
      Peripherals.BinIo._000K912_Y32
  - instance: Wp100A103ResistantDetector
    type: NexeedBursterResis2316
    version: V1.0
    peripheral: _Wp100A103ResistantInterface
    station_data_host_name: Station.StationData.BursterSetting.HostName
    commands:
      - SET_RANGE
      - SINGLE_MEAS
    manual_release: CommonManRelease AND TRUE
  - instance: Wp100A104Kistler
    type: NexeedKistlerForceStroke
    version: V1.2
    peripheral: _100A104
    channel: IKistlerForceStroke
    display_stroke_force: true
    manual_functions:
      - Measure
      - LockKeyboard
      - UnlockKeyboard
      - SetProgram
      - ZeroX
      - TareY
      - ReadData
      - WriteData
    manual_release: CommonManRelease AND TRUE
    hmi_release_condition: confirmed_cpstudio_true

handler_home_condition:
  all:
    - Wp100K101SafetyDoor.Unit.OutImm.IsInBasPos
    - Wp100K102PressingCylinder.Unit.OutImm.IsInBasPos
