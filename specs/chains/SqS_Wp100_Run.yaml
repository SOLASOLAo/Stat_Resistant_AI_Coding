schema_version: 1

chain:
  name: SqS_Wp100_Run
  kind: subchain
  instance: Wp100.SqS_Run
  subchain_id: 2
  unit_reference: Wp100Unit
  status: implemented_offline_verified
  reuse: sequential callers only

operator_guidance_plan:
  status: applied_offline_verified
  apply_gate: completed
  plan_sha256: 0fcb072b9cc175f79559fea7b18f0f434474acc1044b7df608352d569b07fd50
  specification: specs/hmi/auto_info_line.yaml
  rule: >-
    The atomic chain owns the yellow information line only while it is active.
    Parallel branch actions must not write Station._AutoInfoline.
  phases:
    - { step: N010, prompt: requested fixture LEFT/MIDDLE/RIGHT }
    - { step: N020, prompt: position-specific press-start instruction }
    - { step: N030, prompt: USER_INFO_CLOSING_SAFETY_DOOR }
    - { step: N045, prompt: position-specific measurement-in-progress text }
    - { step: N095, prompt: USER_INFO_RETURN_SAFE_POSITION }
    - { step: N130, prompt: USER_INFO_OPENING_SAFETY_DOOR }
    - { step: N999, prompt: USER_INFO_TEXT_CLEAR }
  source_files:
    state: applied_and_readback_verified
    root: src/plc/project/Station010/SqS_Wp100_Run
    note: all parallel branch Actions, including final completion-hold steps, remain display-write free
  completed_prerequisites:
    - CpStudio AutoInfoLineEnum items 4 through 16 saved and exported
    - REST writer transactional safety blockers closed and offline tests passed
    - fresh PlanOnly output reviewed before explicit Apply

implementation_resolution:
  - location: N095
    status: applied_offline_verified
    prior_issue: >-
      An unexpected end of Kistler MEASURE was read through CheckUnitDone into
      _unitResult without propagating the returned ERROR to the SFC return value.
    resolution: >-
      N095 now propagates ERROR to _retVal; PLE save/readback and the fresh
      offline Build both passed.

sfc_conventions:
  parallel_element: simultaneousDivergence / simultaneousConvergence
  branch_1_return: _retVal
  branch_2_return: _retVal2
  source: OpconSfcChain and NxBase framework technical manual
  diagnostic_rule: each device owns separate Start and Wait steps
  completion_hold: after the real Wait succeeds, a separate final Action holds only its branch return value at OK until convergence

input:
  name: MeasurePos
  plc_path: Wp100.SqS_Run.MeasurePos
  storage_class: VAR_INPUT
  type: MeasurePsoEnum
  authority: cpstudio
  configured_by: user
  mutation_entrypoint: CpStudio
  ai_access: read_and_consume_only
  note: >-
    The CpStudio-owned enum type currently retains the generated spelling
    MeasurePsoEnum. SqC writes this input only while SqS_Run is READY. The
    atomic operation records the input in Result.MeasurePos at N000 and the
    caller must not change it while the chain is running.
  values:
    LEFT:
      required_true: [_100B603]
      required_false: [_100B601, _100B602]
    MIDDLE:
      required_true: [_100B602]
      required_false: [_100B601, _100B603]
    RIGHT:
      required_true: [_100B601]
      required_false: [_100B602, _100B603]

station_data:
  PressForceTimeout:
    plc_path: Station.StationData.PressForceTimeout
    type: DINT
    unit: ms
    validation: greater than 2000; zero must not disable monitoring
    snapshot: at Kistler preflight for each position

position_feedback:
  base: OutImm.IsInBasPosIn
  work: OutImm.IsInWrkPosIn
  rule: Physical-position predicates use inputs independently of valve outputs; retain CheckUnitDone, ExecState and all safety-relay conditions.

force_interlock:
  source: Wp100A104Kistler.Unit.OutImm.ForceAct
  threshold_n: 2500
  stable_time_ms: 2000
  comparison: strictly greater; equality is insufficient force
  implementation: CheckPressForce method with VAR_INST state and the existing _pressDelay TON
  waiting: independent total wait starts at confirmed press work position; force bounce resets only the stable TON
  measurement: check force before start and before accepting completion; force loss wins over completion in the same scan
  fault_event: Wp100.EVENT_PRESS_FORCE_INVALID
  fault_class: SOFTERROR
  fault_behavior: latched step hold, invalidate result, cancel Burster; request Kistler END only while owned, MeasRunning and ExecState RUNNING, then clear it; do not command press-up
  reset: explicit chain cancel/finish and new initialization; force recovery alone cannot resume
  reset_event_cleanup: attempt UnlockEvent then ClearEvent once for the owned nonzero handle, then invalidate it; their BOOL results must not strand N000, and any unlocked pending event remains acknowledgeable
  safety_priority: existing safety and ControlOn override the requested pressure hold

type_data:
  source: Station.TypeData.Wp100
  apply_boundary: current TypeData after Change-over ApplyData
  fields:
    Burster.UpperRange:
      automatic_use: none; retained only for generated dataset compatibility
    Burster.LowerRange:
      automatic_use: none; retained only for generated dataset compatibility
    Burster.UpperLimit:
      target: Wp100A103ResistantDetector.Unit.ParCmd.UpperLimit
      command: SINGLE_MEAS
    Burster.LowerLimit:
      target: Wp100A103ResistantDetector.Unit.ParCmd.LowerLimit
      command: SINGLE_MEAS
    Burster.ReadTemperature:
      target: Wp100A103ResistantDetector.Unit.ParCmd.ReadTemperature
      command: SINGLE_MEAS
    Burster.ProgramNo:
      target: Burster 2316 active measuring program before the first measurement
      command: "*RCL <programNo> through FB_Wp100BursterProgramSelect; numeric 0..15, no P prefix"
      transport: close standard Nexeed socket, use one short TCP 5555 session, send EOT, close
    KistlerProgramNo:
      target: Wp100A104Kistler.Unit.ParCmd.Measure.ProgNo
      command: MEASURE
  validation:
    - CpStudio generated range checks keep both range values within 0 through 8
    - no application ordering check is needed for the unused legacy range fields
    - Burster.LowerLimit is not greater than Burster.UpperLimit
    - Burster.ProgramNo is within the instrument range 0 through 15
    - no narrower Kistler program-number range is assumed beyond BYTE

steps:
  - id: N000
    comment: Initialize run
    purpose: clear the previous result and record the MeasurePos input
  - id: N010
    comment: Check fixture position
    purpose: enforce the selected three-sensor one-hot state and press base position
  - id: N020
    comment: Wait start button
    action: FB_OperatorButton
    input: _000S610
    lamp: _000P610
    blink: Root.RootNode.FlashBits.Toggle500ms
  - id: N030
    comment: Close safety door
    command: Wp100K101SafetyDoor.WRKPOS
    start_requires:
      - pressing cylinder in base position
      - Peripherals.BinIo._000K981_Y32
  - id: N040
    comment: Wait safety feedback
    completion_requires:
      - safety door in work position
      - Peripherals.BinIo._000K913_Y32
      - Peripherals.BinIo._000K912_Y32
  - id: N045
    comment: Check measure release
    purpose: select and acknowledge the TypeData Burster program before releasing both parallel start branches
    start_requires:
      - safety door in work position
      - Peripherals.BinIo._000K913_Y32
      - Peripherals.BinIo._000K912_Y32
      - pressing cylinder in base position and READY
      - Burster Unit READY
      - Kistler READY and device ready
    program_selection:
      source: Station.TypeData.Wp100.Burster.ProgramNo
      protocol: RESISTOMAT 2316 *RCL <programNo> over TCP 5555; numeric 0..15, no P prefix
      failure_display: clear the measuring prompt; retain selector ErrorCode and block both branches. A dedicated HMI alarm requires a CpStudio-owned event.
      completion: instrument ACK received, EOT sent, temporary socket Close completed, standard IpBurster2316.Reset then ClearError then Open each completed with OK
      measuring_driver_handoff: every position takes the same fresh lifecycle; Reset and ClearError each have a 3 s watchdog, Open has a 35 s watchdog, all before motion; no concurrent temporary socket or SINGLE_MEAS and no cached readiness
      asynchronous_contract: each socket method completes by return value, not IsOpen or byte count; abandoned pending methods use Reset
      cancellation: StationUnit.OnCall continues Execute=false and Busy=true cleanup after the single-cycle OnChainFinish callback; pending standard Reset/ClearError/Open completes standard Reset without a second Close because Reset already closes the stream; never substitute temporary-socket Reset
      diagnostics: retain the first failure through cleanup; clear stale byte counters only at an explicit new request
      retry: no automatic retry or branch release after failure; a new operator-requested chain run is required
  - id: N046
    comment: Check program range mode
    purpose: retain the range loaded by the instrument program; do not issue SET_RANGE
    completion_requires:
      - Peripherals._Wp100A103ResistantInterface.ParCfg.UseAutoRange is false
    configuration_owner: user changes AutoRange in CpStudio Peripheral and exports; AI never overrides generated parameters
  - id: N047
    comment: Wait Burster ready
    completion_requires:
      - Wp100A103ResistantDetector Unit is READY
      - Wp100A103ResistantDetector Unit Execute is false
    rule: no CheckUnitDone for SET_RANGE because that command is no longer issued
  - id: N050
    comment: Start press WRKPOS
    parallel_group: measurement_start
    branch: 1
    return_value: _retVal
    command: Wp100K102PressingCylinder.WRKPOS
    start_requires: [Kistler started, Kistler MeasRunning, Kistler ExecState not ERROR]
  - id: N060
    comment: Wait press WRKPOS
    parallel_group: measurement_start
    branch: 1
    return_value: _retVal
    wait_for: Wp100K102PressingCylinder command started by N050
  - id: N051
    comment: Start Kistler MEASURE
    parallel_group: measurement_start
    branch: 2
    return_value: _retVal2
    command: Wp100A104Kistler.MEASURE
    program: Station.TypeData.Wp100.KistlerProgramNo
    preflight: CheckPressForce Phase 1 validates PressForceTimeout before START
    watchdog: max of configured Kistler MeasuringTimeout and PressForceTimeout plus 30 s; overhead budget needs field acceptance
  - id: N061
    comment: Wait Kistler running
    parallel_group: measurement_start
    branch: 2
    return_value: _retVal2
    wait_for: Wp100A104Kistler.Unit.OutImm.MeasRunning
  - id: N065
    comment: Press start branch complete
    parallel_group: measurement_start
    branch: 1
    return_value: _retVal
    entry_requires: N060 returns OK
    action: _retVal := OK;
  - id: N066
    comment: Kistler start branch complete
    parallel_group: measurement_start
    branch: 2
    return_value: _retVal2
    entry_requires: N061 returns OK
    action: _retVal2 := OK;
  - parallel_convergence: measurement_start
    completion_requires: [_retVal = OK, _retVal2 = OK]
  - id: N070
    comment: Wait force >2500N for 2s
    wait_for: CheckPressForce Phase 2; continuous force qualification within PressForceTimeout
  - id: N080
    comment: Start resistance test
    command: Wp100A103ResistantDetector.SINGLE_MEAS
    force_guard: Phase 2 before first request; Phase 3 while a single-step hold retains an already started request
    parameters:
      - Station.TypeData.Wp100.Burster.UpperLimit
      - Station.TypeData.Wp100.Burster.LowerLimit
      - Station.TypeData.Wp100.Burster.ReadTemperature
  - id: N090
    comment: Wait resistance result
    result: Result.Resistance
    force_guard: Phase 3 before CheckUnitDone and before result acceptance
  - id: N095
    comment: Check release ready
    purpose: release both parallel finish branches after resistance measurement
    start_requires:
      - pressing cylinder in work position and READY
      - Kistler MEASURE still running
  - id: N100
    comment: Start press BASPOS
    parallel_group: measurement_finish
    branch: 1
    return_value: _retVal
    command: Wp100K102PressingCylinder.BASPOS
  - id: N110
    comment: Wait press BASPOS
    parallel_group: measurement_finish
    branch: 1
    return_value: _retVal
    wait_for: Wp100K102PressingCylinder command started by N100
  - id: N101
    comment: Stop Kistler MEASURE
    parallel_group: measurement_finish
    branch: 2
    return_value: _retVal2
    capture_before_command:
      - Kistler NoPass
      - Kistler program number
      - Kistler cyclic actual force
      - Kistler cyclic actual stroke
    command: Kistler END only while owned, MeasRunning and ExecState RUNNING; refresh the gate on repeated single-step calls
    timing: activated by the same simultaneous divergence as N100
  - id: N120
    comment: Wait Kistler result
    parallel_group: measurement_finish
    branch: 2
    return_value: _retVal2
    result: Result.Kistler
    note: adds the final verdict; force/stroke were latched at press-up start and full READ_DATA curve is not requested
  - id: N115
    comment: Press return branch complete
    parallel_group: measurement_finish
    branch: 1
    return_value: _retVal
    entry_requires: N110 returns OK
    action: _retVal := OK;
  - id: N125
    comment: Kistler result branch complete
    parallel_group: measurement_finish
    branch: 2
    return_value: _retVal2
    entry_requires: N120 returns OK after result capture
    action: _retVal2 := OK;
  - parallel_convergence: measurement_finish
    completion_requires: [_retVal = OK, _retVal2 = OK]
  - id: N130
    comment: Open safety door
    command: Wp100K101SafetyDoor.BASPOS
    start_requires: [pressing cylinder in base position]
  - id: N140
    comment: Wait door open
    wait_for: Wp100K101SafetyDoor command started by N130
  - id: N999
    comment: Finish run
    result: DONE

output:
  path: Wp100.SqS_Run.Result
  type: Wp100RunResultStruct
  retention: valid after DONE until the next N000 initialization
  members:
    - MeasurePos
    - FixturePositionValid
    - Resistance.Valid
    - Resistance.OutOfLimit
    - Resistance.Ok
    - Resistance.Value
    - Resistance.Temperature
    - Kistler.Valid
    - Kistler.Ok
    - Kistler.Nok
    - Kistler.NoPass
    - Kistler.ProgramNo
    - Kistler.Force
    - Kistler.Stroke

cleanup:
  on: [DONE, ERROR, CANCEL]
  reset:
    - operator button Execute and _000P610
    - press-delay timer
    - CheckPressForce timers and locked event at the explicit chain boundary
    - safety-door Execute
    - pressing-cylinder Execute
    - Burster program selector Execute and temporary TCP session
    - Burster Execute
    - Kistler EndMeasurement false and Execute false; the falling Execute edge invokes standard Unit Cancel, never send END for pre-start failures
    - per-execution started flags
  retain:
    - Result until the next execution

caller_contract:
  - while Wp100.SqS_Run is READY, write Wp100.SqS_Run.MeasurePos
  - set Wp100.SqS_Run.Execute to TRUE
  - wait through CheckSubChainDone(Wp100.SqS_Run)
  - do not start the single instance from two callers concurrently

