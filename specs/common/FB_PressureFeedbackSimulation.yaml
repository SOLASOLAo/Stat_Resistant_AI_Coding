schema_version: 1
version: V1.0.0

object:
  path: Application/Fbs/FB_PressureFeedbackSimulation
  owner: ai
  source: src/plc/common/FB_PressureFeedbackSimulation.st
  purpose: replace two intentionally unwired pressure switches without writing BinIo inputs

control_source:
  on_state: Station.MainPressureControl.xValveOn
  off_state: NOT Station.MainPressureControl.xValveOn
  forbidden_sources:
    - raw Control On button
    - ControlOn.OutImm.IsCtrlOn as a substitute for the final valve command
    - ControlOn rising/falling edge pulses as sustained states
    - direct write to a physical BinIo input

timing:
  switch_delay: T#1S
  initialization: provide LOW immediately so the valve can start from a safe state
  valve_on_transition:
    before_delay: retain the previous stable state
    after_delay: { low: false, high: true }
  valve_off_transition:
    before_delay: retain the previous stable state
    after_delay: { low: true, high: false }

invariants:
  - LOW and HIGH are never true simultaneously
  - disabling monitoring resets both outputs and both timers
  - enabling monitoring always provides virtual LOW before the first valve command
  - the existing FB_MainPressureControl remains responsible for valve output, 5 s monitoring and events
  - the existing maintenance-door release remains in the valve command path

physical_inputs_replaced:
  - _000B085A_LOW
  - _000B085A_HIGH
