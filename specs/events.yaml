schema_version: 1

events:
  - owner: Wp100
    symbol: EVENT_PRESS_FORCE_INVALID
    designator: -5
    class: SOFTERROR
    lock: true
    conditions:
      - total force qualification wait expires without force >2500 N continuously for 2 s
      - force <=2500 N during resistance measurement, including a single-step hold after its start
      - Kistler measurement/data becomes invalid or press work position is lost during force monitoring
      - PressForceTimeout <=2000 ms
    additional_info:
      requirement: retain first fault position, reason and force in STRING(63)
    behavior: hold the SFC step and invalidate the result; finish/cancel instruments, never request press-up
    reset: explicit chain cancel/finish and next initialization; never clear on force recovery alone
    safety: existing safety, ControlOn and standard device faults remain authoritative
  - owner: Station
    symbol: EVENT_MAINTENANCE_DOOR_NOT_LOAKED
    designator: -2
    class: ERROR
    lock: true
    conditions:
      - _000K980_A missing after T#5S lock monitoring
      - _000K981_B missing after T#5S lock monitoring
      - _000K981_Y32 missing T#1S after both doors are closed
    additional_info:
      requirement: identify the failed BMK and signal condition
      signals: [_000K980_A, _000K981_B, _000K981_Y32]
    reset: Control Off after both lock commands are removed
  - owner: Station
    symbol: EVENT_PRESSURE_NOT_HIGHER
    designator: -4
    class: ERROR
    lock: true
    reset: Control On removed and only low-pressure feedback active
  - owner: Station
    symbol: EVENT_PRESSURE_NOT_LOWER
    designator: -5
    class: ERROR
    lock: true
    reset: Control On removed and only low-pressure feedback active
