schema_version: 1

station:
  name: Station
  handler_type: mode_handler
  work_positions:
    - name: Wp100
      handler_type: command_handler

addons:
  - instance: Station.ControlOn
    type: NexeedControlOnAddon
    version: V2.0
  - instance: Station.EmergencySwitch
    type: NexeedEmergencySwitchAddon
    version: V2.0
  - instance: Station.StationLamp
    type: NexeedStationLampAddon
    version: V2.3.1.0
    instance_id: 7
    hardware_type: MULTIPLE_LEDS
  - instance: Station.StationDataSetManager
    type: data_set_manager

data_sets:
  runtime_owner: Nexeed DataSetAccess on the HMI IPC
  runtime_format: .dat
  folders:
    station_data: '\\%DataSetAccessHost%\OpconData$\StationData'
    type_data: '\\%DataSetAccessHost%\OpconData$\TypeData'
  default_names:
    station_data: StationData
    type_data: '1111111111'
  plc_boundary: >-
    DataSetAccess loads and applies the selected files; PLC logic consumes
    Station.StationData and Station.TypeData and does not access SMB or DAT files directly.
  generated_hmi_manager_dat_role: schema_and_default_values_only

cyclic_application_controls:
  - instance: Station.MainPressureControl
    type: FB_MainPressureControl
    version: V1.0.0
  - instance: Station.PressureFeedbackSimulation
    type: FB_PressureFeedbackSimulation
    version: V1.0.0
  - instance: Station.MaintenanceDoorControl
    type: FB_MaintenanceDoorControl
    version: V1.0.0

control_on_integration:
  standard_addon: Station.ControlOn
  maintained_release_output: _000K911
  switch_on_pulse_output: _000K951
  electrical_feedback: _000K911_Y32
  application_release: Station.ControlOn.ParImm.UserEnableControlOn
  fault_propagation:
    - Unit and Peripheral diagnostics are aggregated by the enclosing OpCon Station
    - in Station010 an unsatisfied Station/application release leaves application_release false and prevents or revokes Control On
    - Station010 pressure faults additionally revoke application_release
  ownership_boundary: application logic must not write _000K911 or _000K951 directly

virtual_pressure_feedback:
  reason: _000B085A_LOW and _000B085A_HIGH have no physical signal connection
  source: Station.MainPressureControl.xValveOn
  switch_delay: T#1S
  initialization_state: { low: true, high: false }
  valve_on_state: { low: false, high: true }
  valve_off_state: { low: true, high: false }
  consumer: Station.MainPressureControl
  physical_binio_write: forbidden

maintenance_door_control:
  lock_outputs: [_000K980, _000K981]
  closed_feedbacks:
    door_a: _000K980_A
    door_b: _000K981_B
  closed_feedback_timeout: T#5S
  safety_relay_feedback: _000K981_Y32
  safety_relay_timeout_after_both_doors_closed: T#1S
  main_pressure_release_requires:
    - both lock outputs active
    - both door-closed feedbacks active
    - _000K981_Y32
    - no latched maintenance-door fault

mode_release:
  modes: [AUTO, MANUAL, HOME, CHANGEOVER]
  all:
    - _000K911_Y32
    - _000K981_Y32
    - Station.MaintenanceDoorControl.xAllDoorsClosed
  additional:
    CHANGEOVER:
      - Station.Unit.IsEmpty

home_condition:
  expression: >-
    Wp100K101SafetyDoor.Unit.OutImm.IsInBasPos AND
    Wp100K102PressingCylinder.Unit.OutImm.IsInBasPos
