schema_version: 1

station:
  name: Station
  handler_type: mode_handler
  work_positions:
    - name: Wp100
      handler_type: command_handler

addons:
  - instance: Station.ControlOn
    type: NexeedControlOnAddon
    version: V2.0
  - instance: Station.EmergencySwitch
    type: NexeedEmergencySwitchAddon
    version: V2.0
  - instance: Station.StationLamp
    type: NexeedStationLampAddon
    version: V2.3.1.0
    instance_id: 7
    hardware_type: MULTIPLE_LEDS
  - instance: Station.StationDataSetManager
    type: data_set_manager

cyclic_application_controls:
  - instance: Station.MainPressureControl
    type: FB_MainPressureControl
  - instance: Station.PressureFeedbackSimulation
    type: FB_PressureFeedbackSimulation
  - instance: Station.MaintenanceDoorControl
    type: FB_MaintenanceDoorControl

virtual_pressure_feedback:
  reason: _000B085A_LOW and _000B085A_HIGH have no physical signal connection
  source: Station.ControlOn.OutImm.IsCtrlOn
  switch_delay: T#1S
  control_on_state: { low: false, high: true }
  control_off_state: { low: true, high: false }
  consumer: Station.MainPressureControl
  physical_binio_write: forbidden

maintenance_door_control:
  lock_outputs: [_000K980, _000K981]
  closed_feedbacks:
    door_a: _000K980_A
    door_b: _000K981_B
  closed_feedback_timeout: T#5S
  safety_relay_feedback: _000K981_Y32
  safety_relay_timeout_after_both_doors_closed: T#1S
  main_pressure_release_requires:
    - both lock outputs active
    - both door-closed feedbacks active
    - _000K981_Y32
    - no latched maintenance-door fault

mode_release:
  modes: [AUTO, MANUAL, HOME, CHANGEOVER]
  all:
    - _000K911_Y32
    - _000K981_Y32
    - Station.MaintenanceDoorControl.xAllDoorsClosed
  additional:
    CHANGEOVER:
      - Station.Unit.IsEmpty

home_condition:
  expression: >-
    Wp100K101SafetyDoor.Unit.OutImm.IsInBasPos AND
    Wp100K102PressingCylinder.Unit.OutImm.IsInBasPos
