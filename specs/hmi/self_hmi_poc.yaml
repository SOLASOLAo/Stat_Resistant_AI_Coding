schema_version: 1

status: phase_1_1_implemented_mode_control_pending_live_acceptance

purpose: >-
  Run an independent Windows HMI against the existing Station010 OPC UA
  interface without changing the CpStudio model or PLC program, then compare
  it with the Nexeed HMI. Only one HMI is used as the control client at a time.

ownership:
  cpstudio_hmi: ../Station010/Hmi
  self_hmi: src/hmi/Bpp.ResistantStation.Hmi
  plc_changes_allowed_for_phase_1: false

technology:
  runtime: .NET 8 WPF
  protocol: OPC UA binary over opc.tcp
  endpoint_source: ../Station010/PublicConfig/PublicInterface_Stat010_V5.11_CtrlX.xml
  symbol_source: ../Station010/Plc/Stat010_V5.11_CtrlX_PLC.Device.Application.xml
  namespace_uri: http://www.boschrexroth.com/OpcUa/Datalayer
  namespace_index_policy: resolve_at_runtime

visual_contract:
  mimic:
    - top station and connection header
    - operation-mode strip
    - left navigation rail
    - central station overview
    - persistent operator-guidance banner
    - device and safety diagnostics
  do_not_copy:
    - Bosch or Nexeed trademarks
    - proprietary icons
    - closed-source VisiWin controls

phase_1:
  access: read_only
  default_write: deny
  source_contract_has_generic_write_method: false
  semantic_mode_request_method: RequestModeAsync
  real_connection_mode_requests_default: disabled
  credentials: runtime_memory_only
  screens:
    - overview
    - manual_functions_read_only
    - public_event_list
    - io_and_full_ethercat_topology
    - station_data
    - type_data
  data:
    - station mode and run state
    - AutoInfoLine bilingual operator guidance
    - EtherCAT health
    - home and cylinder positions
    - fixture and product sensors
    - four safety relay feedbacks
    - Burster and Kistler UnitState
    - nine EtherCAT slave states and 38 published named digital I/O values
    - Kistler semantic result, force and displacement values
    - StationData and TypeData current values, excluding staging structures
    - explicit disconnected, waiting and bad-quality masking
  offline_demo: required

phase_1_1:
  implemented:
    - subscribe PublicEventList and decode supported ExtensionObject representations
    - reconnect after OPC UA keepalive failure
    - mask live data after 3000 ms without a healthy OPC UA session keepalive
    - reviewed node and EtherCAT topology catalog with Symbol XML validation
  live_acceptance_remaining:
    - verify ctrlX runtime representation of PublicEventList once read-only
    - verify active/cleared event filtering with one controlled event cycle
    - verify all nine EtherCAT array indexes against online values

phase_2_control:
  status: minimal_mode_switch_implemented_pending_live_acceptance
  single_active_hmi: required
  panel_token: 1
  explicit_write_allowlist:
    - Station.Extension.TokenRequest
    - Station.Extension.ModeIdRequest
  allowed_mode_ids:
    automatic: 1
    manual: 3
    home: 4
    changeover: 5
  behavior:
    - fresh-read and require emergency-stop and maintenance-door feedback before a request
    - fresh-read and require Station.Unit.IsEmpty for Changeover
    - leave safety-door and combined-circuit mode release authority in the PLC
    - request panel token 1 and require exact Token readback 1
    - request mode and wait for ModeId readback
    - never treat OPC UA write success as PLC mode acceptance
  prohibit:
    - direct physical output writes
    - internal Chain state writes
    - Heartbeat writes until remote manual functions are implemented
    - TokenChangeResponse until multi-panel behavior is accepted
    - persistence of credentials

acceptance:
  - solution restores and builds with the locked dependency graph
  - offline demo updates all first-screen states
  - all configured NodeIds resolve against the current Symbol export
  - subscriptions remain read-only and the only write implementation is the semantic mode adapter
  - mode adapter can target only TokenRequest and ModeIdRequest
  - no FORCE, download, PLC start/stop or physical I/O write API exists
  - no credentials or certificates enter Git
  - Station010 and Std remain byte-for-byte untouched by this work
