  station_compile: data/reports/hmi/forcetrace-sampling-20260916/station-reopened-final.json
  actual_plc_or_ipc_deployment: false
  remaining: real sample cadence and CPU/watchdog margin, channel array transfer, late opening/reconnect, real process limits, runtime language switching, IPC CSV access
