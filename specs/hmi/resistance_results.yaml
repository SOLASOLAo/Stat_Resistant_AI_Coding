# The interface exists. Do not recreate these fields under Wp100.
cpstudio_prerequisite:
  location: Model -> Station -> Variables -> Station -> HMIResistance
  create_via: already created and exported by the user; preserve the current structure
  shared_settings:
    UseInHMI: true
    OpcUaVisible: true
    OpcUaAccess: Read
    Persistent: false
  source_unit_note: Only display values are converted to mOhm; stored result, limits and grading remain unchanged.
  positions:
    - position: LEFT
      source: Wp100.SqC_Run.Result.Left.Resistance
      variables:
        value: {name: _HmiResistanceLeft_mOhm, type: REAL, initial: 0.0}
        valid: {name: _HmiResistanceLeftValid, type: BOOL, initial: false}
        ok: {name: _HmiResistanceLeftOk, type: BOOL, initial: false}
    - position: MIDDLE
      source: Wp100.SqC_Run.Result.Middle.Resistance
      variables:
        value: {name: _HmiResistanceMiddle_mOhm, type: REAL, initial: 0.0}
        valid: {name: _HmiResistanceMiddleValid, type: BOOL, initial: false}
        ok: {name: _HmiResistanceMiddleOk, type: BOOL, initial: false}
    - position: RIGHT
      source: Wp100.SqC_Run.Result.Right.Resistance
      variables:
        value: {name: _HmiResistanceRight_mOhm, type: REAL, initial: 0.0}
        valid: {name: _HmiResistanceRightValid, type: BOOL, initial: false}
        ok: {name: _HmiResistanceRightOk, type: BOOL, initial: false}
  follow_up: Read permissions verified locally; resolve the PLE symbol REST stream failure and verify complete CpStudio Export roundtrip; field verification remains separate.

plc_mapping:
  ownership: implementation-only display hook; new declarations remain CpStudio-owned
  source: src/plc/project/Station010/StationUnit/OnCall.HmiResistance.st
  object: Application/Station/_this/StationUnit/OnCall
  apply_script: scripts/plc/apply_hmi_resistance_rest.ps1
  offline_applied: true
  build: {errors: 0, warnings: 5, signatures: [C0351, C0351, C0351, C0351, C0373]}
  value: source.Value * 1000.0 when source.Valid; otherwise 0.0 hidden by the HMI validity gate
  valid: source.Valid
  ok: source.Valid AND source.Ok
  behavior:
    - Copy from the retained parent results, never the reusable atomic result or live instrument result.
    - Continue publishing while the sequence is idle so completed results remain visible until the next N000 reset.
    - Cancellation does not invent results for uncompleted positions; completed positions can remain for inspection.
    - Do not change source retention, force checks, cylinder interlocks or instrument commands.

implemented_view:
  location: Model -> Station -> HMI configuration -> UserDefined
  preserve: existing station/type labels, home-position indication, picture and bottom auto-infoline
  layout: three compact vertically stacked result rows in the unused area to the right of the picture
  value_control: Mod_VarOut; read-only; top-to-bottom label Right/Middle/Left resistance; unit mOhm displayed as mΩ
  position_reference: PLC members and control IDs retain fixture position; displayed titles and pending labels identify workpiece position
  text_resource_by_fixture:
    Left: {value: ResistanceRight, pending: ResistanceRightPending}
    Middle: {value: ResistanceMiddle, pending: ResistanceMiddlePending}
    Right: {value: ResistanceLeft, pending: ResistanceLeftPending}
  status_control: standard indicator/label with validity gating; not an editable Mod_VarIn
  states:
    invalid: grey dash and Not completed; never show zero as a valid measurement or false Ok as NOK
    valid_ok: value and green OK
    valid_nok: value and red NOK
    communication_bad: required but unverified; native quality behavior and stale status labels need runtime validation
  binding_note: Use Ch1.L1.Station.HMIResistance members from the picker; do not use the obsolete Wp100 display paths.
  precision_note: Suggested numeric format is '{0:F4}' in mOhm; display precision does not change stored precision or imply instrument accuracy.
  user_steps: docs/hmi_resistance_cpstudio_steps.md
  canvas: {width: 944, height: 572}
  row_y: [100, 212, 324]
  new_control_ids: AI_Resistance{Left|Middle|Right}{Value|Status|Pending}
  original_controls_preserved: 5
  replaced_trial_copies: [Mod_VarOut1, Mod_Led2]
  total_controls: 14
  offline_validation:
    - Nine members match the existing VWN pool with three VT_R4 and six VT_BOOL types.
    - Official SFCLoader 6.5 loads all fourteen controls without errors, including fifteen property bindings.
    - Native control rendering confirms layout and original picture; numeric output is a designer placeholder.
    - CpStudio HMI Configurator reopened the generated Station/UserDefined without a new error dialog.
  runtime_validation: pending; design-time rendering does not prove data updates, state transitions or communication quality
  save_export_roundtrip: model saved and SFC preserved through three attempts; complete Export blocked by symbol REST stream failure

acceptance_pending:
  - New sequence starts with all three positions not completed; no previous-cycle result remains green.
  - Finishing LEFT updates only LEFT; MIDDLE and RIGHT stay not completed until each atomic chain finishes.
  - Changing the live instrument reading cannot overwrite a previously completed position's display.
  - Known conversion example 0.001 Ohm displays 1 mOhm; quality follows the raw PLC result, not rounding.
  - NOK is distinguishable from not-completed and from a communication failure.
  - Cancel/force fault leaves uncompleted positions invalid; it does not imply an overall sequence pass.
  - Save/Export/Build and generated Symbol/VWN/view readback succeed before IPC deployment.
  - IPC .50 field check agrees with PLC Value/Valid/Ok for all three positions.

