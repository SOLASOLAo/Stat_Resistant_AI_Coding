chain_mapping:
  SqC_Wp100_Run:
    responsibility: product presence and LEFT-to-MIDDLE-to-RIGHT sequencing
    steps:
      N000: USER_INFO_TEXT_CLEAR
      N010: USER_INFO_LOAD_PART only while product detection blocks LEFT
      N015: USER_INFO_MOVE_FIXTURE_LEFT
      N040: USER_INFO_LOAD_PART only while product detection blocks MIDDLE
      N045: USER_INFO_MOVE_FIXTURE_MIDDLE
      N070: USER_INFO_LOAD_PART only while product detection blocks RIGHT
      N075: USER_INFO_MOVE_FIXTURE_RIGHT
      N999: USER_INFO_MEASUREMENT_COMPLETE
    implemented_graph_steps:
      - step: N015
        comment: Wait fixture LEFT
        prompt_release: safety door open and pressing cylinder raised
        completion: safe prompt release plus _100B601 true and _100B602/_100B603 false, followed by a fresh _100B701/_100B702 product check
      - step: N045
        comment: Wait fixture MIDDLE
        prompt_release: safety door open and pressing cylinder raised
        completion: safe prompt release plus _100B602 true and _100B601/_100B603 false, followed by a fresh _100B701/_100B702 product check
      - step: N075
        comment: Wait fixture RIGHT
        prompt_release: safety door open and pressing cylinder raised
        completion: safe prompt release plus _100B603 true and _100B601/_100B602 false, followed by a fresh _100B701/_100B702 product check

  SqS_Wp100_Run:
    responsibility: one-position atomic measurement and detailed active-state prompt
    steps:
      N010: select USER_INFO_MOVE_FIXTURE_LEFT/MIDDLE/RIGHT from MeasurePos while validating the one-hot position
      N020: select USER_INFO_PRESS_START_LEFT/MIDDLE/RIGHT and keep the existing 500 ms start-lamp behavior
      N030: USER_INFO_CLOSING_SAFETY_DOOR
      N045: select USER_INFO_MEASURING_LEFT/MIDDLE/RIGHT before the parallel measurement-start group
      N095: USER_INFO_RETURN_SAFE_POSITION before the parallel press-up/Kistler-finish group
      N130: USER_INFO_OPENING_SAFETY_DOOR
      N999: USER_INFO_TEXT_CLEAR

writer_rules:
  - a move-fixture instruction is displayed only while the safety door is open and the pressing cylinder is raised
  - SqC wait actions write the requested fixture-position prompt before SqS starts
  - SqC wait-for-subchain actions never write the display while SqS is active
  - SqS writes only from sequential/common-gate actions; parallel branch actions never write the display
  - both OnChainFinish methods clear stale operator requests on ERROR or CANCEL
  - SqC keeps USER_INFO_MEASUREMENT_COMPLETE after DONE until the next execution clears it in N000

acceptance:
  cpstudio:
    - old indices 0 through 3 are unchanged
    - new items 4 through 16 exist with matching English and Chinese comments
    - save, reopen, and export complete without error
  hmi:
    - 1033 language resources contain the English text
    - 2052 language resources contain the Chinese text
  plc:
    - assignments use AutoInfoLineEnum symbols rather than raw integers
    - parent and child chains do not compete for the display in the same active phase
    - ERROR and CANCEL cannot leave a move-fixture or press-button prompt active
    - offline Build completes with zero errors and no new warning signatures

