schema_version: 1

status: exported_and_plc_applied_offline_verified

display:
  control: Station/UserDefined.Mod_EnumDisplay1
  enum: AutoInfoLineEnum
  variable: Station._AutoInfoline
  variable_type: INT
  purpose: show the current operator-facing automatic-process instruction

execution_path:
  - SqM_Station_Auto
  - SqS_Station_Auto
  - Wp100.Unit with Wp100Cmd.RUN
  - SqC_Wp100_Run
  - SqS_Wp100_Run executed for LEFT, MIDDLE, and RIGHT

ownership:
  enum_and_translations: cpstudio
  enum_write_entrypoint: manual entry in CpStudio; no supported Enum write API was found in CpStudio 5.11
  plc_assignments: ai_owned_action_implementations
  user_action: completed; items 4 through 16 were appended, saved, and exported from CpStudio

index_policy:
  mode: append_only
  immutable_existing_indices: [0, 1, 2, 3]
  never_reorder_or_reuse: true
  plc_assignment: use qualified enum symbols; never use raw integer literals

