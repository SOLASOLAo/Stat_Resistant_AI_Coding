schema_version: 1

hooks:
  - id: station_changeover_request_cleanup
    object: Application/Station/_this/Chains/Sub/SqS_Station_ChangeOverFile
    specification: specs/hmi/changeover_requests.yaml
    apply_script: scripts/plc/apply_changeover_requests_rest.ps1
    invariants:
      - native SFC graph and all generated declarations stay unchanged
      - N010 accepts empty or own guidance request and preserves unrelated requests
      - N999 invokes _reset before DONE; existing cancel and error callbacks invoke _reset
      - cleanup clears only ChgOvGuidanceView and DataFileDialog request names
      - N030 N040 TypeData loading and homing logic stay unchanged
  - id: station_hmi_force_trace
    object: Application/Station/_this/StationUnit/OnCall
    source: src/plc/project/Station010/StationUnit/OnCall.HmiForceTrace.st
    specification: specs/hmi/plc_force_curve.yaml
    invariants:
      - Station.ForceTrace LeftFrame/MiddleFrame/RightFrame ARRAY 0..30035 and StatisticsFrame ARRAY 0..209 OF DWORD are generated by the native CpStudio object
      - ForceTraceAddon.OnCallEnter samples once per MainTask scan before child chains; StationUnit.OnCall only publishes quality/measuring bridge signals; arrays publish at nominal 100 ms
      - parent N000 begins the cycle; atomic N050 records t0 after acknowledgement before WRKPOS
      - N101 marks normal end intent; actual MeasRunning falling ends observation
      - first CheckPressForce fault and chain ERROR or CANCEL preserve the first terminal reason
      - recorder and force guard share the same accepted sample; recorder is required for qualification in v2
  - id: station_application_instances
    object: Application/Station/_this/Station
    required_symbols:
      MachineCommonPressure: FB_MainPressureControl
      PressureFeedbackSimulation: FB_PressureFeedbackSimulation
      MachineCommonDoor: FB_MaintenanceDoorControl
  - id: station_cyclic_controls
    object: Application/Station/_this/StationUnit/OnCall
    cancellation_cleanup_source: src/plc/project/Station010/StationUnit/OnCall.BursterCleanup.st
    required_calls:
      - Station.MachineCommonDoor
      - Station.PressureFeedbackSimulation
      - Station.MachineCommonPressure
      - AiWp100.BursterProgramSelect
    invariants:
      - Station not OPERATIONAL or bus not OK drives controlled outputs to safe state
      - maintenance-door release gates the main-pressure valve
      - virtual pressure feedback follows MainPressureControl.xValveOn with a T#1S transition delay
      - ControlOn.OutImm.IsCtrlOn is not used as a substitute for the final valve command
      - physical _000B085A_LOW and _000B085A_HIGH inputs are not consumed by application logic
      - maintenance relay feedback is required within T#1S after both doors close
      - maintenance-door event AdditionalInfo identifies the failed BMK
      - pressure faults use the generated Station event constants
      - Burster selector is called here only with Execute false and Busy true to finish cancellation cleanup; this hook never starts selection or motion
  - id: station_hmi_resistance_display
    object: Application/Station/_this/StationUnit/OnCall
    source: src/plc/project/Station010/StationUnit/OnCall.HmiResistance.st
    specification: specs/hmi/resistance_results.yaml
    invariants:
      - copy only retained Wp100.SqC_Run.Result.Left/Middle/Right.Resistance
      - display values alone are scaled from Ohm to mOhm by 1000.0
      - invalid results publish zero with Valid false and Ok false
      - copy every cycle including idle; parent N000 still owns reset
      - no instrument command, source-result mutation or motion output
      - preserve all CpStudio declarations and the rest of OnCall exactly
  - id: station_output_wiring
    object: Application/Station/_this/StationUnit/OnApplyOutputs
    required_outputs:
      - _000K980
      - _000K981
      - _000K085A
    invariants:
      - each physical output has one application business writer
  - id: wp100_home_output
    object: Application/Station/Wp100/_this/Wp100Unit/OnApplyOutputs
    required_expression: >-
      Wp100K101SafetyDoor.Unit.OutImm.IsInBasPosIn AND
      Wp100K102PressingCylinder.Unit.OutImm.IsInBasPosIn
  - id: station_mode_release
    object: Application/Station/_this/StationExtension/OnModeRelease
    required_signals:
      - Peripherals.BinIo._000K911_Y32
      - Peripherals.BinIo._000K981_Y32
    modes: [AUTO, MANUAL, HOME, CHANGEOVER]
    invariants:
      - existing maintenance-door closed condition remains active
      - CHANGEOVER additionally requires Station.Unit.IsEmpty
  - id: safety_door_manual_release
    object: Application/Station/Wp100/Wp100K101SafetyDoor/Wp100K101SafetyDoorExtension/OnManRelease
    required_release_prefix: CommonManRelease
    required_signals:
      - Peripherals.BinIo._000K981_Y32
  - id: pressing_cylinder_manual_release
    object: Application/Station/Wp100/Wp100K102PressingCylinder/Wp100K102PressingCylinderExtension/OnManRelease
    required_release_prefix: CommonManRelease
    required_signals:
      - Wp100K101SafetyDoor.Unit.OutImm.IsInWrkPosIn
      - Peripherals.BinIo._000K913_Y32
      - Peripherals.BinIo._000K912_Y32
  - id: burster_manual_release
    object: Application/Station/Wp100/Wp100A103ResistantDetector/Wp100A103ResistantDetectorExtension/OnManRelease
    required_release_prefix: CommonManRelease
    required_releases:
      - ReleaseSetRange
      - ReleaseStartMeas
    invariants:
      - ReleaseSetRange is CommonManRelease AND FALSE because the instrument program owns range/compensation
      - ReleaseStartMeas retains CommonManRelease and invokes the standard Unit SINGLE_MEAS through the single owner
  - id: burster_native_channel
    object: Application/Station/Wp100/_this/Wp100Unit/OnApplyParameters
    owner: cpstudio
    invariants:
      - the generated standard channel is Peripherals._Burster2316 implementing IBursterResis2316
      - no application ParCfg binding or AiWp100.Burster instance may be restored
      - endpoint and timeout come from native Peripheral parameters; port 5555 and timeout 30000 ms remain unchanged
  - id: burster_single_owner_configuration
    object: Application/Station/Wp100/_this/Wp100Unit/OnCall
    invariants:
      - only RequestedProgramNo is copied from active Station.TypeData.Wp100.Burster.ProgramNo
      - no network method or measurement is invoked by this cyclic configuration hook
  - id: kistler_manual_release
    object: Application/Station/Wp100/Wp100A104Kistler/Wp100A104KistlerExtension/OnManRelease
    required_release_prefix: CommonManRelease
    required_releases:
      - ReleaseMeasure
      - ReleaseLockKeyboard
      - ReleaseUnlockKeyboard
      - ReleaseSetProgram
      - ReleaseZeroX
      - ReleaseTareY
      - ReleaseReadData
      - ReleaseWriteData
  - id: home_chain_cleanup
    object: Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Home/OnChainFinish
    required_cleanup:
      - FB_OperatorButton Execute false
      - _000P610 false through FB output
      - safety-door Execute false
      - pressing-cylinder Execute false
      - started flags false
  - id: safety_door_close_confirmation
    object: Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Home/_aN120_active
    required_signals:
      - Peripherals.BinIo._000K913_Y32
      - Peripherals.BinIo._000K912_Y32
    invariants:
      - a safety-door close command cannot complete the step until both safety feedbacks are true
      - pressing-cylinder start repeats the same interlock for an already-closed door
  - id: wp100_run_position_interlock
    object: Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Run/_aN010_active
    input: Wp100.SqS_Run.MeasurePos
    storage_class: VAR_INPUT
    input_type: MeasurePsoEnum
    interface_owner: cpstudio
    ai_access: read_and_consume_only
    required_signals:
      - Peripherals.BinIo._100B601
      - Peripherals.BinIo._100B602
      - Peripherals.BinIo._100B603
    invariants:
      - MeasurePos name, type, direction and OES declaration are configured only in CpStudio
      - the requested fixture position is supplied by the caller before Execute
      - exactly the selected position sensor is true and the other two are false
      - the pressing cylinder is in base position before operator acknowledgement
  - id: wp100_run_safety_interlock
    object: Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Run
    required_signals:
      - Peripherals.BinIo._000K981_Y32
      - Peripherals.BinIo._000K913_Y32
      - Peripherals.BinIo._000K912_Y32
    invariants:
      - maintenance safety relay is required before closing the safety door
      - safety-door and all-door feedbacks are required before lowering the press
      - the safety door opens only after the press is confirmed in base position
  - id: wp100_run_measurement_timing
    object: Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Run
    required_units:
      - Wp100A104Kistler
      - Wp100A103ResistantDetector
      - Wp100K102PressingCylinder
    invariants:
      - Burster ProgramNo is validated as 0 through 15 and acknowledged through *RCL before measurement
      - Peripherals._Burster2316 is the only TCP owner; the selector has no socket and delegates Open and SelectProgram to it
      - selector Done requires IDN-checked Open, RCL ACK, program readback and no instrument error; no Close/Open handoff between owners
      - manual SINGLE_MEAS uses the same owner and active TypeData program; initial selection is not dependent on automatic N045
      - every measurement checks fresh RCL readback, rejects a changed program, starts INIT only once and never accepts a stale EOC result
      - cancellation finishes pending I/O through the same owner Reset; clearing the selector after Done never resets a subsequent Unit measurement
      - the instrument program owns the Burster range; automatic chains never issue SET_RANGE or copy TypeData UpperRange/LowerRange
      - N046 requires Connected, SelectionVerified, matching SelectedProgram, idle Operation and no driver ErrorCode; N047 retains Burster READY with Execute false
      - Burster grading limits and temperature selection come from the active Wp100 TypeData
      - Kistler measurement program comes from the active Wp100 TypeData
      - N045 issues one standard Kistler SET_PROGRAM before requiring measuring Ready; completion requires matching program feedback, Ready, no Alarm and no running measurement
      - N050 and N051 retain all safety gates and require matching Kistler program feedback and no device Alarm before their start requests
      - Kistler MEASURE and pressing-cylinder WRKPOS use one simultaneous SFC divergence
      - branch 1 uses _retVal and branch 2 uses _retVal2
      - each device has a separate Start step and Wait step for diagnostics
      - Kistler MeasRunning releases press-down; resistance starts only when force >PressForceThreshold and a full PressForceStableTime rolling window has 3*sigma <PressForce3SigmaLimit
      - latch threshold, 3-sigma limit, window and total timeout per position; valid window 1..60000 ms and total timeout greater than window; zero sigma limit blocks
      - StationData.PressForceTimeout bounds total qualification waiting; low force or invalid data during resistance measurement latches a soft error and holds the step
      - Kistler EndMeasurement and pressing-cylinder BASPOS use one simultaneous SFC divergence
      - Kistler stop therefore occurs no later than one second after press-up start
      - Result remains available after DONE and is cleared only by the next N000
  - id: wp100_run_cleanup
    object: Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Run/OnChainFinish
    required_cleanup:
      - FB_OperatorButton Execute false and _000P610 false
      - press-delay timer false
      - safety-door Execute false
      - pressing-cylinder Execute false
      - Burster program selector Execute false
      - Burster Execute false
      - Kistler EndMeasurement false and Execute false; use standard Unit Cancel on the falling Execute edge
      - CheckKistlerProgram state reset in N000 and OnChainFinish; no direct device alarm reset
      - all per-execution flags false
  - id: wp100_run_command_sequence
    object: Application/Station/Wp100/_this/Chains/Cmd/SqC_Wp100_Run
    specification: specs/chains/SqC_Wp100_Run.yaml
    required_order: [LEFT, MIDDLE, RIGHT]
    required_subchain: Wp100.SqS_Run
    required_signals:
      - Peripherals.BinIo._100B701
      - Peripherals.BinIo._100B702
    required_event: Wp100.EVENT_PART_DETECT_SENSOR
    invariants:
      - both product-detection signals are checked before every atomic execution
      - MeasurePos is written only while SqS_Run is READY
      - the same SqS_Run instance is executed and awaited sequentially
      - AdditionalInfo identifies _100B701, _100B702 or both missing signals
      - LEFT, MIDDLE and RIGHT results are retained separately
      - OnChainFinish resets SqS_Run.Execute and removes this chain's locked soft error
  - id: dataset_plausibility_warning_cleanup
    objects:
      - Application/Station/_this/Addons/StationDataSetManagerAddon/OnCheckData
      - Application/Station/_this/Addons/TypeDataSetManagerAddon/OnCheckData
    owner: mixed
    interface_owner: cpstudio
    invariants:
      - generated range checks remain present
      - legacy Burster range fields retain generated bounds but do not drive automatic range or application ordering checks
      - Wp100 Burster lower limit is not greater than upper limit
      - the application-specific placeholder warning is absent after review
