schema_version: 1

objects:
  - path: Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Home
    api_path: /devices/Device/Plc%20Logic/Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Home
    language: SFC
    write_strategy:
      - GET complete object
      - verify implementation hash
      - replace only declared attributes
      - PUT complete object
      - GET and compare normalized readback
    step_comment_attribute_guid: 7d894980-aeea-405c-a0f6-e2b26429c58f
    step_comments:
      N000: Initialize home
      N010: Wait start button
      N110: Close safety door
      N120: Wait door closed
      N130: Raise press cylinder
      N140: Wait press raised
      N150: Open safety door
      N160: Wait door open
      N999: Finish home
  - path: Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Run
    api_path: /devices/Device/Plc%20Logic/Application/Station/Wp100/_this/Chains/Sub/SqS_Wp100_Run
    language: SFC
    apply_script: scripts/plc/apply_wp100_run_rest.ps1
    apply_status: blocked_until_interface_preserving
    write_strategy:
      - GET complete object
      - verify the CpStudio-generated declaration without changing it
      - preserve the complete declaration and write only the audited SFC graph
      - create or update action objects and result DUTs through official REST
      - save through ProjectJob
      - GET and compare every declaration, implementation and graph readback
    step_comment_attribute_guid: 7d894980-aeea-405c-a0f6-e2b26429c58f
    step_comments:
      N000: Initialize run
      N010: Check fixture position
      N020: Wait start button
      N030: Close safety door
      N040: Wait safety feedback
      N045: Check measure release
      N050: Start press WRKPOS
      N051: Start Kistler MEASURE
      N060: Wait press WRKPOS
      N061: Wait Kistler running
      N070: Wait press delay
      N080: Start resistance test
      N090: Wait resistance result
      N095: Check release ready
      N100: Start press BASPOS
      N101: Stop Kistler MEASURE
      N110: Wait press BASPOS
      N120: Wait Kistler result
      N130: Open safety door
      N140: Wait door open
      N999: Finish run
    parallel_groups:
      measurement_start:
        branches:
          - [N050, N060]
          - [N051, N061]
      measurement_finish:
        branches:
          - [N100, N110]
          - [N101, N120]
    branch_return_values: [_retVal, _retVal2]
  - path: Application/Station/Wp100/_this/Chains/Cmd/SqC_Wp100_Run
    api_path: /devices/Device/Plc%20Logic/Application/Station/Wp100/_this/Chains/Cmd/SqC_Wp100_Run
    language: SFC
    apply_script: scripts/plc/apply_wp100_run_sequence_rest.ps1
    apply_status: blocked_until_interface_preserving
    write_strategy:
      - GET the complete CpStudio-generated object and all children
      - verify and preserve the CpStudio-generated declaration
      - verify graph and generated-child baseline hashes
      - create or update the canonical actions, methods and result DUT through official REST
      - replace the SFC graph and remove obsolete generated template actions
      - save through ProjectJob and compare every REST readback
    step_comment_attribute_guid: 7d894980-aeea-405c-a0f6-e2b26429c58f
    step_comments:
      N000: Initialize measurement sequence
      N010: Check part before LEFT
      N020: Start LEFT measurement
      N030: Wait LEFT measurement
      N040: Check part before MIDDLE
      N050: Start MIDDLE measurement
      N060: Wait MIDDLE measurement
      N070: Check part before RIGHT
      N080: Start RIGHT measurement
      N090: Wait RIGHT measurement
      N999: Finish measurement sequence
